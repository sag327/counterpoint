<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2221%22 fill=%22none%22 stroke=%22%23d4b888%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <title>Counterpoint · Study No. 2 · Echo</title>
  <style>/* INLINE_STYLES */</style>
</head>
<body>
  <header>
    <div class="brand">Counterpoint<span>STUDY NO. 2 · v0.2</span></div>
    <button id="lab-toggle" aria-expanded="false" aria-controls="lab" hidden>Laboratory</button>
  </header>
  <main>
    <nav id="worlds" aria-label="Models">
      <button type="button" data-world="conduction" aria-pressed="true">Conduction</button>
      <button type="button" data-world="circulation" aria-pressed="false">Circulation</button>
      <button type="button" data-world="echo" aria-pressed="false">Echo</button>
    </nav>
    <div class="stage-controls">
      <nav id="views" aria-label="View">
        <span class="view-label" aria-hidden="true">View</span>
        <div class="view-switch">
          <button type="button" data-view="network" aria-pressed="true">Network</button>
          <button type="button" data-view="ladder" aria-pressed="false">Ladder</button>
        </div>
      </nav>
      <button id="pause" type="button" aria-label="Pause" title="Pause" disabled>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path class="pause-icon" d="M8 5h2.5v14H8zm5.5 0H16v14h-2.5z"/>
          <path class="play-icon" d="m8 5 11 7-11 7z"/>
        </svg>
      </button>
    </div>
    <div id="stage">
      <canvas id="canvas" role="img"></canvas>
      <canvas id="view-canvas" role="img" hidden></canvas>
      <div id="sites" role="group" aria-label="Sites"></div>
      <div id="status" aria-live="polite"></div>
    </div>
    <section id="performance" class="controls" aria-label="Performance controls" hidden>
      <p id="protocol-hint" class="instructions" aria-live="off"></p>
      <div class="actions">
        <button id="guide" disabled hidden>Find a rhythm</button>
        <button id="premature" disabled hidden>Premature impulse</button>
        <button id="find-echo" disabled hidden aria-label="Find the echo: the model at nominal settings, paced at 600 ms, then one early beat that gives a single AV-nodal echo.">Find the echo</button>
        <button id="find-arrhythmia" disabled hidden aria-label="Find the arrhythmia: the model at nominal settings, paced at 600 ms, then one early beat that starts sustained AV-nodal reentry.">Find the arrhythmia</button>
      </div>
      <div id="pacing-controls" class="pacing-controls" role="group" aria-label="Pacing">
        <div class="pacing-input">
          <div class="cycle-stepper">
            <button id="pacing-minus" type="button" aria-label="Decrease cycle length by 10 ms">−</button>
            <input id="pacing-cycle" type="number" min="150" max="2000" step="10" value="600" inputmode="numeric" aria-label="Pacing cycle length" aria-describedby="pacing-unit">
            <span id="pacing-unit">ms</span>
            <button id="pacing-plus" type="button" aria-label="Increase cycle length by 10 ms">+</button>
          </div>
          <button id="pacing-toggle" type="button" aria-pressed="false">Pace</button>
        </div>
        <output id="pacing-readout" aria-live="off"></output>
      </div>
      <div class="settings" role="group" aria-label="Playback controls">
        <button id="sound" class="icon-button" type="button" aria-label="Mute sound" title="Mute sound">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4Z"/>
            <path class="sound-on" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
            <path class="sound-off" d="m15 9 6 6m0-6-6 6"/>
          </svg>
        </button>
        <label for="dilation">Playback</label>
        <select id="dilation" aria-describedby="dilation-hint"></select>
        <span id="dilation-hint" class="visually-hidden">Fraction of real time.</span>
        <button id="reset" type="button" disabled>Reset</button>
      </div>
    </section>
    <div id="card-layer" aria-live="off"></div>
    <aside id="lab" aria-label="Laboratory" hidden>
      <h2>Laboratory</h2>
      <div id="lab-study" hidden></div>
      <div id="lab-content"></div>
      <button id="export">Export event history</button>
    </aside>
  </main>
  <dialog id="notes-sheet" aria-labelledby="notes-title">
    <div class="notes-bar"><span class="draft-mark">DRAFT</span><span id="notes-title">Liner notes</span><button type="button" id="notes-close" aria-label="Close the liner notes">×</button></div>
    <article id="notes-body" class="notes-body"></article>
  </dialog>
  <footer>© 2026 Stephen Gaeta</footer>
  <script type="text/plain" id="protocol-worker-source">/* INLINE_WORKER */</script>
  <script>/* INLINE_APP */</script>
</body>
</html>
