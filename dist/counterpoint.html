.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* Instructions: short, legible, directly under the stage (creator decision 2026-11-27). */
.instructions{text-align:center;font:16px/1.5 Georgia,serif;color:var(--ink);margin:4px auto 14px;max-width:60ch}
.instructions kbd,.instructions b{font:inherit;color:var(--gold);font-weight:normal}

.counterpoint-inspector {
  --inspector-line: #3b464c;
  --raster-accepted: #83d2ba;
  --raster-blocked: #eca29a;
  --raster-stimulus: #e6c287;
  min-width: 0;
}

.counterpoint-inspector [hidden] {
  display: none !important;
}

.counterpoint-inspector #metrics {
  display: block;
  margin-bottom: 18px;
  font-variant-numeric: tabular-nums;
}

.inspector-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.inspector-panel {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--inspector-line);
  border-radius: 6px;
  background: #10181e;
}

.inspector-wide {
  grid-column: 1 / -1;
}

.inspector-panel h3 {
  margin: 0 0 10px;
  color: var(--ink, #eee5d5);
  font: 20px Georgia, serif;
}

.inspector-panel p {
  margin: 8px 0;
  font-size: 13px;
  line-height: 1.45;
}

.inspector-panel dl {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: 6px 10px;
  margin: 12px 0;
  font-size: 13px;
}

.inspector-panel dt {
  color: var(--muted, #aaadae);
}

.inspector-panel dd {
  margin: 0;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.inspector-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
}

.inspector-panel select {
  max-width: 65%;
}

.inspector-panel input[type="number"] {
  width: 5.8em;
  min-height: 44px;
  padding: 5px 8px;
  color: inherit;
  background: #151b20;
  border: 1px solid #677176;
  border-radius: 6px;
}

.inspector-panel input[type="number"][aria-invalid="true"] {
  border-color: var(--raster-blocked);
}

.inspector-panel .inspector-error {
  color: var(--raster-blocked);
}

.inspector-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.inspector-actions button {
  text-align: left;
}

.inspector-legend,
.inspector-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 6px 0;
  padding: 0;
  list-style: none;
  color: var(--muted, #aaadae);
  border: 0;
  font-size: 12px;
}

.inspector-legend span {
  display: inline-block;
  width: 12px;
  font-size: 16px;
  font-weight: bold;
}

.raster-key-accepted { color: var(--raster-accepted); }
.raster-key-blocked { color: var(--raster-blocked); }
.raster-key-stimulus { color: var(--raster-stimulus); }

.inspector-filters legend {
  padding: 0;
  font-size: 13px;
}

.inspector-filters label {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  gap: 4px;
}

.inspector-filters input {
  width: 16px;
  height: 16px;
  accent-color: var(--gold, #d6b880);
}

.inspector-scroll {
  max-width: 100%;
  overflow: auto;
}

.inspector-scroll:focus-visible {
  outline: 2px solid var(--gold, #d6b880);
  outline-offset: 2px;
}

.inspector-scroll svg {
  width: 100%;
  min-width: 28rem;
  display: block;
  overflow: visible;
}

.inspector-scroll svg text {
  fill: #bfc8ca;
  font: 12px system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

.inspector-scroll svg .raster-site {
  fill: var(--ink, #eee5d5);
}

.raster-selected { fill: #203039; }
.raster-guide { stroke: #50606a; }
.raster-cursor { stroke: #dbe4e9; stroke-dasharray: 3 3; }
.raster-accepted { stroke: var(--raster-accepted); stroke-width: 2; }
.raster-blocked { stroke: var(--raster-blocked); stroke-width: 1.5; fill: none; }
.raster-stimulus { fill: var(--raster-stimulus); }

.inspector-log-scroll {
  max-height: 18rem;
}

.inspector-log-scroll table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  text-align: left;
}

.inspector-log-scroll th,
.inspector-log-scroll td {
  padding: 5px 7px;
  border-bottom: 1px solid var(--inspector-line);
}

.inspector-log-scroll th {
  position: sticky;
  top: 0;
  background: #19262e;
}

.inspector-log-scroll tr[data-group="blocked"] td:nth-child(3) {
  color: var(--raster-blocked);
}

@media (max-width: 640px) {
  .inspector-grid { grid-template-columns: 1fr; }
}

/* Lab inspector card (ticket 14d). Dark plate style; the canvas draws the plot,
   DOM sliders sit on the handles so they are focusable and screen-reader visible. */
.lab-card {
  --lab-bg: #070B12; --lab-panel: #0D1520; --lab-rule: #1B2736; --lab-text: #E3DED5;
  --lab-text2: #9CA9B8; --lab-gold: #C8A878; --lab-blue: #83A9C8; --lab-blue-core: #D9F1FF;
  width: min(420px, 100%); padding: 14px 16px 16px; color: var(--lab-text);
  background: var(--lab-panel); border: 1px solid var(--lab-rule); border-radius: 10px;
  font: 13px Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums;
}
.lab-card[hidden] { display: none; }
.lab-card-header { display: flex; align-items: baseline; gap: 10px; }
.lab-card-header h3 { margin: 0; flex: 1; font: italic 20px 'EB Garamond', Georgia, serif; font-weight: 400; }
.lab-card-modified { font-size: 11px; color: var(--lab-gold); border: 1px solid var(--lab-gold); border-radius: 999px; padding: 1px 8px; }
.lab-card-modified[hidden] { display: none; }
.lab-card-close { min-height: 32px; min-width: 32px; padding: 0; background: transparent; border: 0; color: var(--lab-text2); font-size: 20px; cursor: pointer; }
.lab-card-state { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 10px 0; color: var(--lab-text2); font-size: 12px; }
.lab-card-state dd { margin: 0; color: var(--lab-text); text-align: right; }
.lab-card-plot { position: relative; margin: 6px -6px 0; touch-action: none; }
.lab-card-plot canvas { display: block; width: 100%; height: 330px; }
.lab-card-handle { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; cursor: grab; outline: none; }
.lab-card-handle:focus-visible { box-shadow: 0 0 0 2px var(--lab-gold); }
.lab-card-handle:active { cursor: grabbing; }
.lab-card-summary { margin: 6px 0 10px; color: var(--lab-text2); font-size: 12px; }
.lab-card-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.lab-card-field { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--lab-text2); font-size: 12px; }
.lab-card-field input { width: 72px; min-height: 32px; padding: 4px 6px; color: var(--lab-text); background: var(--lab-bg); border: 1px solid var(--lab-rule); border-radius: 5px; text-align: right; }
.lab-card-default { margin-top: 12px; min-height: 36px; padding: 6px 14px; color: var(--lab-gold); background: transparent; border: 1px solid var(--lab-rule); border-radius: 6px; cursor: pointer; }
.lab-card-default:disabled { opacity: .35; cursor: default; }
.lab-card-note { margin: 10px 0 0; color: var(--lab-text2); font: italic 13px 'EB Garamond', Georgia, serif; }
.lab-card-key { font-size: 14px; gap: 6px 14px; }
.lab-card-key dd { font-variant-numeric: tabular-nums; }
.lab-card-section { border-top: 1px solid var(--lab-rule); margin: 0; max-width: none; }
.lab-card-section > summary { display: list-item; min-height: 44px; padding: 12px 0; text-align: left; color: var(--lab-text2); cursor: pointer; font-size: 13px; }
.lab-card-section[open] { padding-bottom: 10px; }
.lab-card-section[open] > summary { color: var(--lab-text); }
.lab-card-table table { width: 100%; font-size: 11px; border-collapse: collapse; }
.lab-card-table caption { text-align: left; color: var(--lab-text2); }
.lab-card-table td, .lab-card-table th { padding: 2px 4px; text-align: right; border-bottom: 1px solid var(--lab-rule); }

/* Study No. 2 additions: study line, view switcher, inspector card layer,
   reading sheet and the Laboratory study panel. Plate palette, fine lines. */
#worlds .study-button{margin-left:clamp(4px,1.6vw,18px);position:relative}
#worlds .study-button::before{content:"";position:absolute;left:calc(-1 * clamp(3px,1vw,11px));top:30%;bottom:30%;border-left:1px solid #34383b}
#study-line{text-align:center;margin:10px 12px 0}
.study-title{margin:0;font:clamp(22px,2.6vw,30px) Georgia,'Times New Roman',serif;font-style:italic;letter-spacing:.3px}
#study-numeral{font-style:normal;font-size:.62em;letter-spacing:2px;color:var(--muted);vertical-align:.18em}
.study-subtitle{margin:4px 0 0;color:#c2c1bb;font:15px Georgia,serif;display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:0 4px}
.study-subtitle>span[aria-hidden]{color:var(--muted)}
.text-link{min-height:32px;padding:4px 6px;border:0;background:transparent!important;color:var(--gold);font:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.chip{min-height:26px;margin-left:8px;padding:2px 10px;border-radius:999px;border-color:#83A9C8;color:#cfe3f3;font:12px system-ui}
#views{display:flex;justify-content:center;align-items:center;gap:2px;margin:6px 0 2px;color:#5d6366}
#views button{min-height:36px;padding:6px 10px;border-color:transparent;background:transparent;color:var(--muted);font:13px Georgia,serif;letter-spacing:.4px}
#views button:hover{color:var(--ink)}
#views button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -1px var(--gold);border-radius:0}
#view-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#stage canvas[hidden]{display:none}
.inspect-list{margin-top:14px}
.inspect-list .hint{margin:4px 0 6px}
.inspect-list .cuts button{font-size:12px}
#card-layer{display:none}
#card-layer.open{display:block;position:fixed;z-index:20;right:16px;top:76px;max-height:calc(100vh - 92px);overflow:auto;border-radius:10px;box-shadow:0 18px 50px #000a}
#card-layer .lab-card{width:min(420px,calc(100vw - 32px))}
@media(min-width:601px){
  main:has(> #card-layer.open + #lab:not([hidden])){--card-width:clamp(260px,33vw,420px)}
  #card-layer.open:has(+ #lab:not([hidden])) .lab-card{width:var(--card-width)}
  #card-layer.open:has(+ #lab:not([hidden])) .lab-card-fields{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  #card-layer.open + #lab:not([hidden]){width:min(900px,calc(100% - var(--card-width) - 48px));margin-inline-end:max(calc(var(--card-width) + 32px),calc((100% - 900px)/2))}
}

dialog#notes-sheet::backdrop{background:#04070acc}

    if (previous !== value) {
      parameterChanged(run, batch, 'delayMs', plan.commandId, ++settings.generation, { linkId: link.id, direction },
        toMs(previous), toMs(value), 'lesion');
    }
  }
  emit(run, batch, 'lesion_changed', { linkId: link.id, progress, completeness: plan.to });
  if (elapsed < plan.duration) {
    scheduleLesionStep(run, plan);
    return;
  }
  lesion.plan = null;
  if (plan.to === 1) changeLinkEnabled(run, batch, link, false, plan.commandId, 'lesion');
}

function scheduleAgentStep(run, plan, type) {
  plan.step++;
  run.agenda.push({ tick: addTicks(plan.start, plan.step * AGENT_STEP), phase: EDIT, order: plan.order, type, plan });
}

function startAgent(run, batch, { value: { agent, dose }, commandId, order }) {
  if (agent === 'stillness') {
    const plan = { start: batch.tick, dose, commandId, order, step: 0 };
    run.stillness.push(plan);
    scheduleAgentStep(run, plan, 'stillnessStep');
  } else {
    run.slowRamp = { start: batch.tick, from: run.slowLevel, to: dose, commandId, order, step: 0 };
    scheduleAgentStep(run, run.slowRamp, 'slowStep');
  }
}

function setErpModifier(run, batch, node, add, scale, commandId) {
  const previous = restedErp(node);
  node.agentErpAdd = add;
  node.agentErpScale = scale;
  const value = restedErp(node);
  if (previous === value) return;
  batch.nodes.add(node);
  parameterChanged(run, batch, 'erpMs', commandId, ++node.erpGeneration, { nodeId: node.id }, toMs(previous), toMs(value), 'agent');
}

function setCycleModifier(run, batch, node, scale, commandId) {
  const previous = agentCycle(node, node.auto.cycle);
  node.agentCycleScale = scale;
  const value = agentCycle(node, node.auto.cycle);
  if (previous === value) return;
  parameterChanged(run, batch, 'cycleMs', commandId, ++node.cycleGeneration, { nodeId: node.id }, toMs(previous), toMs(value), 'agent');
}

// Stillness: the strongest active envelope sets e(t) for every site, in node ID order.
function stepStillness(run, batch, { plan }) {
  const ended = plan.step * AGENT_STEP >= STILLNESS_END;
  if (ended) run.stillness.splice(run.stillness.indexOf(plan), 1);
  let level = 0;
  for (const active of run.stillness) level = Math.max(level, active.dose * stillnessEnvelope(batch.tick - active.start));
  for (const node of run.nodes.values()) {
    if (node.tissue === 'nodal') setErpModifier(run, batch, node, Math.round(STILLNESS_NODAL_ERP * level), 1, plan.commandId);
    else if (node.tissue === 'atrial') setErpModifier(run, batch, node, 0, 1 - STILLNESS_ATRIAL_ERP * level, plan.commandId);
    else if (node.tissue === 'sinus') setCycleModifier(run, batch, node, 1 + STILLNESS_SINUS_CYCLE * level, plan.commandId);
  }
  if (!ended) scheduleAgentStep(run, plan, 'stillnessStep');
}

// Slow the current: the dose level ramps linearly and then persists until reset.
function stepSlow(run, batch, { plan }) {
  if (run.slowRamp !== plan) return;
  const steps = SLOW_RAMP / AGENT_STEP;
  const level = plan.step >= steps ? plan.to : plan.from + (plan.to - plan.from) * plan.step / steps;
  const previous = run.slowLevel;
  run.slowLevel = level;
  if (level !== previous) {
    for (const link of run.links.values()) {
      if (!link.nodal) parameterChanged(run, batch, 'slowing', plan.commandId, ++link.slowingGeneration, { linkId: link.id }, previous, level, 'agent');
    }
  }
  if (plan.step < steps) scheduleAgentStep(run, plan, 'slowStep');
  else run.slowRamp = null;
}

function applyEdit(run, batch, item) {
  switch (item.type) {
    case 'setLinkEnabled': return enableLink(run, batch, item);
    case 'setNodeERP': return editErp(run, batch, item);
    case 'setDirectionDelay': return editDelay(run, batch, item);
    case 'setAutomaticity': return editCycle(run, batch, item);
    case 'setRestitution': return editRestitution(run, batch, item);
    case 'setDecrement':
    case 'setEntry': return editExtraLaw(run, batch, item);
    case 'setCoupling': return editCoupling(run, batch, item);
    case 'setTone': return editTone(run, batch, item);
    case 'setAutonomic': return editAutonomic(run, batch, item);
    case 'cancelTrain': return cancelTrain(run, batch, item);
    case 'ablate': return startLesion(run, batch, item);
    case 'lesionStep': return stepLesion(run, batch, item);
    case 'applyAgent': return startAgent(run, batch, item);
    case 'stillnessStep': return stepStillness(run, batch, item);
    case 'slowStep': return stepSlow(run, batch, item);
  }
  throw new Error(`Unhandled edit ${item.type}`);
}

function intersection(a, b) {
  if (a.direction === b.direction ||
      Math.max(a.departure, b.departure) >= Math.min(a.arrival, b.arrival)) return null;
  const [ab, ba] = a.direction === 'ab' ? [a, b] : [b, a];
  const abDuration = BigInt(ab.arrival - ab.departure);
  const baDuration = BigInt(ba.arrival - ba.departure);
  // The exact rational keeps endpoint classification and half-tick rounding stable.
  const positionNumerator = BigInt(ba.arrival - ab.departure);
  const denominator = abDuration + baDuration;
  const elapsed = (2n * abDuration * positionNumerator + denominator) / (2n * denominator);
  const tick = ab.departure + Number(elapsed);
  return {
    tick,
    phase: COLLISION,
    order: Math.min(a.ordinal, b.ordinal),
    secondOrder: Math.max(a.ordinal, b.ordinal),
    first: a.ordinal < b.ordinal ? a : b,
    second: a.ordinal < b.ordinal ? b : a,
    position: Number(positionNumerator) / Number(denominator),
  };
}

function considerCollision(run, batch, link, a, b) {
  charge(batch);
  const candidate = intersection(a, b);
  if (candidate === null) return;
  const current = link.collision;
  if (current !== null && (candidate.tick - current.tick || candidate.order - current.order ||
    candidate.secondOrder - current.secondOrder) >= 0) return;
  link.collision = candidate;
  run.agenda.push(candidate);
}

function recomputeCollisions(run, batch, link) {
  const ab = [];
  const ba = [];
  for (const transit of link.active.values()) (transit.direction === 'ab' ? ab : ba).push(transit);
  for (const a of ab) {
    for (const b of ba) considerCollision(run, batch, link, a, b);
  }
}

function applyCollision(run, batch, collision) {
  const { first, second, position } = collision;
  const link = first.link;
  if (link.collision !== collision) return;
  link.collision = null;
  removeTransit(batch, first);
  removeTransit(batch, second);
  emit(run, batch, 'conduction_collision', {
    linkId: link.id,
    transitIds: Object.freeze([first.event.transitId, second.event.transitId]),
    position,
  });
  recomputeCollisions(run, batch, link);
}

function addCause(batch, node, event, source) {
  let causes = batch.causes.get(node);
  if (causes === undefined) {
    causes = { ids: [], sources: new Set(), links: new Set(), automatic: false };
    batch.causes.set(node, causes);
  }
  causes.ids.push(event.eventId);
  causes.sources.add(source);
  if (source === 'automaticity') causes.automatic = true;
  if (event.type === 'conduction_arrived') causes.links.add(event.linkId);
}

function attempt(run, batch, node, source, triggerId) {
  const event = emit(run, batch, 'stimulus_attempted', { nodeId: node.id, source, triggerId });
  addCause(batch, node, event, source);
}

// Pulses enter the stimulus phase by train command order; each schedules its successor.
function pulse(run, batch, { train, index }) {
  if (!train.active) return;
  attempt(run, batch, train.node, 'stimulus', `${train.commandId}#${index}`);
  train.delivered = index;
  if (index < train.count) {
    run.agenda.push({ tick: addTicks(batch.tick, train.cycle), phase: STIMULUS, order: train.order, train, index: index + 1 });
  } else {
    train.active = false;
    batch.trains.push({ train, cancelled: false });
  }
}

function arrive(run, batch, transit) {
  const link = transit.link;
  if (!link.active.has(transit.ordinal)) return;
  removeTransit(batch, transit);
  const event = emit(run, batch, 'conduction_arrived', {
    nodeId: transit.to.id,
    linkId: link.id,
    transitId: transit.event.transitId,
  });
  addCause(batch, transit.to, event, 'conduction');
}

// §C. A driven capture earlier than the cycle grows suppression; a spontaneous firing decays it.
function updateSuppression(run, node, spontaneous, interval, tick) {
  const auto = node.auto;
  const { gain, max, warmup } = auto.overdrive;
  if (spontaneous) {
    auto.suppression = Math.round(warmup * auto.suppression);
    return;
  }
  if (interval === null) return;
  const cycle = effectiveCycle(run, node, tick);
  if (interval < cycle) auto.suppression = Math.min(max, auto.suppression + Math.round(gain * (cycle - interval)));
}

function determineOutcomes(run, batch) {
  const captures = [];
  for (const node of [...batch.causes.keys()].sort(byId)) {
    const causes = batch.causes.get(node);
    const common = {
      nodeId: node.id,
      source: causes.sources.size === 1 ? causes.sources.values().next().value : 'mixed',
      causeIds: Object.freeze(causes.ids),
      incomingLinkIds: Object.freeze([...causes.links].sort()),
    };
    // §D entrance block: only the focus's own automatic attempt can capture it.
    if (node.auto.protected && !causes.automatic) {
      const refractory = node.until !== null && batch.tick < node.until;
      emit(run, batch, 'activation_blocked', {
        ...common,
        cause: 'protected',
        remainingErpMs: refractory ? toMs(node.until - batch.tick) : 0,
        refractoryUntilMs: toMs(node.until),
      });
      continue;
    }
    if (node.until !== null && batch.tick < node.until) {
      emit(run, batch, 'activation_blocked', {
        ...common,
        cause: 'refractory',
        remainingErpMs: toMs(node.until - batch.tick),
        refractoryUntilMs: toMs(node.until),
      });
      continue;
    }
    const priorUntil = node.until;
    const previous = node.last;
    const recoveryBefore = recoveryAt(node, batch.tick);
    const interval = previous === null ? null : batch.tick - previous;
    // §A uses the pre-capture state: DI is measured from the previous refractory end.
    const diastolicInterval = priorUntil === null ? null : batch.tick - priorUntil;
    const erp = node.restitution === null ? restedErp(node) : agentErp(node, restitutionErp(node.restitution, diastolicInterval));
    if (node.auto.overdrive !== null && node.auto.cycle !== null) {
      updateSuppression(run, node, causes.automatic, interval, batch.tick);
    }
    node.last = batch.tick;
    node.until = addTicks(batch.tick, erp);
    batch.nodes.add(node);
    const payload = {
      ...common,
      priorActivationMs: toMs(previous),
      intervalMs: interval === null ? null : toMs(interval),
      erpMs: toMs(erp),
      refractoryUntilMs: toMs(node.until),
      recoveryBefore,
    };
    if (run.v11) payload.diastolicIntervalMs = toMs(diastolicInterval);
    const activation = emit(run, batch, 'activation', payload);
    captures.push({ node, activation, priorUntil, incoming: causes.links, interval });
  }
  return captures;
}

function transitDuration(settings, tick, priorUntil) {
  const { decrement, delay } = settings;
  if (decrement === null || priorUntil === null) return delay;
  const recoveryInterval = Math.max(0, tick - priorUntil);
  return addTicks(delay, Math.round(decrement.maxExtra * Math.exp(-recoveryInterval / decrement.tau)));
}

function nodalFactor(run, node, tick) {
  if (node.tissue !== 'nodal') return 1;
  let factor = 1;
  if (run.tone !== 0) factor *= 1 - TONE_DECREMENT * run.tone;
  if (run.autonomic?.nodal) factor *= breathFactor(run.autonomic, tick);
  return factor;
}

// Contract 1.1.0 travel time: link delay (with lesion), Slow, source decrement, then §B entry
// slowing from the destination state after every outcome of this batch.
function delayParts(run, capture, link, direction, to, departure) {
  const settings = link[direction];
  const base = settings.delay;
  const linkDelay = link.lesion === null ? base : lesionDelay(base, link.lesion.progress);
  const agent = run.slowLevel > 0 && !link.nodal ? slowExtra(linkDelay, run.slowLevel, capture.interval) : 0;
  let source = 0;
  if (settings.decrement !== null && capture.priorUntil !== null) {
    source = decrementExtra(settings.decrement, Math.max(0, departure - capture.priorUntil), nodalFactor(run, capture.node, departure));
  }
  const nominal = addTicks(departure, linkDelay + agent + source);
  const entry = settings.entry !== null && to.until !== null && nominal >= to.until ? entryExtra(settings.entry, nominal - to.until) : 0;
  return { base, lesion: linkDelay - base, agent, source, entry };
}

function launch(run, batch, capture, link, direction) {
  const ordinal = ++run.transitSeq;
  const departure = batch.tick;
  const to = run.nodes.get(direction === 'ab' ? link.b : link.a);
  let parts = null;
  let duration;
  if (run.v11) {
    parts = delayParts(run, capture, link, direction, to, departure);
    duration = parts.base + parts.lesion + parts.agent + parts.source + parts.entry;
  } else {
    duration = transitDuration(link[direction], departure, capture.priorUntil);
  }
  const arrival = addTicks(departure, duration);
  const payload = {
    transitId: `t${ordinal}`,
    activationId: capture.activation.eventId,
    linkId: link.id,
    linkGeneration: link.generation,
    fromNodeId: capture.node.id,
    toNodeId: to.id,
    departureMs: toMs(departure),
    arrivalMs: toMs(arrival),
  };
  if (parts !== null) {
    payload.delayParts = Object.freeze({
      baseMs: toMs(parts.base), sourceMs: toMs(parts.source), entryMs: toMs(parts.entry),
      lesionMs: toMs(parts.lesion), agentMs: toMs(parts.agent),
    });
  }
  const event = emit(run, batch, 'conduction_launched', payload);
  const transit = { ordinal, event, direction, departure, arrival, link, to };
  for (const existing of link.active.values()) considerCollision(run, batch, link, existing, transit);
  link.active.set(ordinal, transit);
  batch.transits.set(event.transitId, event);
  run.agenda.push({ tick: arrival, phase: ARRIVAL, order: ordinal, transit });
}

function drain(run, batch, phase, process) {
  while (run.agenda.peek()?.tick === batch.tick && run.agenda.peek().phase === phase) {
    charge(batch);
    process(run.agenda.pop());
  }
}

// §D. Each accepted activation of a coupling source shifts the target's next attempt.
// Inputs outside the target's current cycle (phase < 0 or >= 1) leave it unchanged.
function modulate(run, batch, captures, planned) {
  for (const capture of captures) {
    for (const coupling of run.couplingsFrom.get(capture.node) ?? []) {
      charge(batch);
      const target = coupling.target;
      const auto = target.auto;
      if (coupling.amplitude === 0 || auto.cycle === null) continue;
      const pending = planned.has(target) ? planned.get(target) : (auto.token === null ? null : auto.next);
      if (pending === null) continue;
      const cycle = effectiveCycle(run, target, batch.tick);
      const phase = (batch.tick - auto.origin) / cycle;
      if (phase < 0 || phase >= 1) continue;
      const shift = phaseShift(cycle, coupling.amplitude, phase);
      const next = Math.max(addTicks(batch.tick, 1), addTicks(pending, shift));
      planned.set(target, next);
      emit(run, batch, 'phase_modulated', {
        nodeId: target.id,
        couplingId: coupling.id,
        sourceActivationId: capture.activation.eventId,
        phase,
        shiftMs: toMs(shift),
        nextAttemptMs: toMs(next),
      });
    }
  }
}

function processBatch(run, tick, budget) {
  const batch = {
    tick, budget, events: [], nodes: new Set(), links: new Set(), transits: new Map(), causes: new Map(), trains: [],
  };
  drain(run, batch, EDIT, edit => applyEdit(run, batch, edit));
  drain(run, batch, COLLISION, collision => applyCollision(run, batch, collision));
  drain(run, batch, STIMULUS, item => {
    if (item.train !== undefined) pulse(run, batch, item);
    else attempt(run, batch, item.target, 'stimulus', item.commandId);
  });
  const dueAutomatic = [];
  drain(run, batch, AUTOMATIC, ({ node, token }) => {
    if (node.auto.token !== token) return;
    dueAutomatic.push(node);
    attempt(run, batch, node, 'automaticity', `auto${++run.autoSeq}`);
  });
  drain(run, batch, ARRIVAL, item => arrive(run, batch, item.transit));
  const captures = determineOutcomes(run, batch);
  const resetAutomatic = new Set();
  for (const capture of captures) {
    for (const { link, direction } of capture.node.incident) {
      charge(batch);
      if (link.enabled && link[direction].enabled && !capture.incoming.has(link.id)) {
        launch(run, batch, capture, link, direction);
      }
    }
    if (capture.node.auto.cycle !== null && capture.node.auto.resetOnCapture) resetAutomatic.add(capture.node);
  }
  // A just-launched wave can meet another wave within half a tick of departure.
  // Finish that collision in this batch after its causal launch.
  drain(run, batch, COLLISION, collision => applyCollision(run, batch, collision));
  for (const node of dueAutomatic) resetAutomatic.add(node);
  // Reset first, then modulate (§D), then commit the schedules.
  const planned = new Map();
  for (const node of resetAutomatic) planned.set(node, planNextAutomatic(run, node, tick));
  if (run.couplingsFrom.size > 0) modulate(run, batch, captures, planned);
  for (const [node, next] of planned) scheduleAutomatic(run, node, next);
  // Trains close in the order they closed: cancellations (edit phase), then completions (stimulus phase).
  for (const { train, cancelled } of batch.trains) {
    emit(run, batch, 'train_completed', {
      commandId: train.commandId, trainId: train.commandId, delivered: train.delivered, count: train.count, cancelled,
    });
  }
  return batch;
}

function requireLimit(value, label) {
  if (!Number.isSafeInteger(value) || value <= 0) throw new RangeError(`${label} must be a positive safe integer`);
  return value;
}

class Engine {
  #run = null;
  #options;

  constructor({
    processingBudget = 10_000, historyBatches = 4096, maxNodes = 4096, maxLinks = 8192, maxConcurrentTrains = TRAIN_CONCURRENCY_MAX,
  } = {}) {
    this.#options = {
      processingBudget: requireLimit(processingBudget, 'Processing budget'),
      historyBatches: requireLimit(historyBatches, 'History batch limit'),
      maxNodes: requireLimit(maxNodes, 'Maximum nodes'),
      maxLinks: requireLimit(maxLinks, 'Maximum links'),
      maxConcurrentTrains: requireLimit(maxConcurrentTrains, 'Maximum concurrent trains'),
    };
  }

  reset(world, freshRunId) {
    requireId(freshRunId, 'runId');
    const { worldId, nodes, links, v11, coupling, autonomic, maxConcurrentTrains } = readWorld(world, this.#options);
    nodes.sort(byId);
    links.sort(byId);
    const run = {
      id: freshRunId,
      worldId,
      nodes: new Map(nodes.map(node => [node.id, node])),
      links: new Map(links.map(link => [link.id, link])),
      committed: null,
      commandIds: new Set(),
      agenda: new Agenda(),
      eventSeq: 0,
      transitSeq: 0,
      autoSeq: 0,
      fault: null,
      v11,
      autonomic,
      autonomicGeneration: 0,
      maxConcurrentTrains,
      lineClosures: new Map(),
      tone: 0,
      toneGeneration: 0,
      couplings: new Map(coupling.map(entry => [entry.id, entry])),
      couplingsFrom: new Map(),
      trains: new Map(),
      stillness: [],
      slowRamp: null,
      slowLevel: 0,
    };
    for (const link of links) {
      run.nodes.get(link.a).incident.push({ link, direction: 'ab' });
      run.nodes.get(link.b).incident.push({ link, direction: 'ba' });
    }
    for (const entry of [...coupling].sort(byId)) {
      const from = run.nodes.get(entry.from);
      entry.target = run.nodes.get(entry.to);
      if (!run.couplingsFrom.has(from)) run.couplingsFrom.set(from, []);
      run.couplingsFrom.get(from).push(entry);
    }
    for (const [order, node] of nodes.entries()) {
      node.order = order;
      if (node.auto.firstAttempt !== null) {
        // Before its first attempt a focus is treated as having fired one cycle earlier.
        node.auto.origin = node.auto.firstAttempt - node.auto.cycle;
        scheduleAutomatic(run, node, node.auto.firstAttempt);
      }
    }
    run.history = new History(run, this.#options.historyBatches);
    const initial = run.history.snapshot(run, 0);
    this.#run = run;
    return initial;
  }

  #requireRun() {
    if (this.#run === null) throw new Error('Reset the engine with a world to start a run');
    return this.#run;
  }

  #running() {
    const run = this.#requireRun();
    if (run.fault !== null) throw new Error('Run is faulted. Reset the engine to continue.', { cause: run.fault });
    return run;
  }

  // Train admission depends only on earlier commands, never on the horizon, so a
  // command log is accepted identically live and on replay.
  #admitTrain(run, { value: { start, last } }) {
    let overlapping = 0;
    for (const train of run.trains.values()) {
      const end = Math.min(train.last, train.cancelTick - 1);
      if (end >= train.start && train.start <= last && start <= end) overlapping++;
    }
    if (overlapping >= run.maxConcurrentTrains) {
      throw new RangeError(`At most ${run.maxConcurrentTrains} trains may overlap in time`);
    }
  }

  // §F. The first complete ablate of a link (by time, then submission) closes it at start +
  // duration for the rest of the run. Judged from earlier commands only, like train admission.
  #admitLinkEdit(run, accepted) {
    const closure = run.lineClosures.get(accepted.target);
    if (accepted.type === 'setLinkEnabled' && accepted.value && closure !== undefined && closure.end <= accepted.tick) {
      throw new RangeError(`Link ${accepted.target.id} is closed by the complete lesion ${closure.commandId}; reset the run to reopen it`);
    }
  }

  #noteClosure(run, { type, target, tick, value, commandId }) {
    if (type !== 'ablate' || value.completeness !== 1) return;
    const closure = run.lineClosures.get(target);
    if (closure === undefined || tick < closure.start) {
      run.lineClosures.set(target, { start: tick, end: addTicks(tick, value.duration), commandId });
    }
  }

  enqueue(command) {
    const run = this.#running();
    const accepted = readCommand(command, run);
    if (accepted.type === 'stimulateTrain') this.#admitTrain(run, accepted);
    if (accepted.type === 'setLinkEnabled' && run.v11) this.#admitLinkEdit(run, accepted);
    const order = run.commandIds.size;
    run.commandIds.add(accepted.commandId);
    this.#noteClosure(run, accepted);
    if (accepted.type === 'stimulateTrain') {
      const { start, cycle, count, last } = accepted.value;
      const train = {
        commandId: accepted.commandId, node: accepted.target, start, cycle, count, last, order, active: true, cancelTick: Infinity, delivered: 0,
      };
      run.trains.set(train.commandId, train);
      run.agenda.push({ tick: start, phase: STIMULUS, order, train, index: 1 });
      return;
    }
    if (accepted.type === 'cancelTrain') accepted.target.cancelTick = Math.min(accepted.target.cancelTick, accepted.tick);
    run.agenda.push({ ...accepted, order, phase: accepted.type === 'stimulate' ? STIMULUS : EDIT });
  }

  advanceTo(tMs) {
    const run = this.#running();
    const horizon = toTick(tMs, 'Horizon');
    if (run.committed !== null && horizon < run.committed) throw new RangeError('Horizon cannot move backward');
    if (horizon === run.committed) return EMPTY_EVENTS;
    const events = [];
    const budget = { remaining: this.#options.processingBudget };
    while (run.agenda.peek()?.tick <= horizon) {
      const tick = run.agenda.peek().tick;
      try {
        const batch = processBatch(run, tick, budget);
        run.history.record(tick, batch);
        for (const event of batch.events) events.push(event);
        run.committed = tick;
      } catch (error) {
        run.fault = new SimulationFault(error, tick, run.committed, events);
        throw run.fault;
      }
    }
    run.committed = horizon;
    return Object.freeze(events);
  }

  committedThroughMs() {

        taper: isRing ? 1 : junctionTaper(Math.min(point.distance, curve.length - point.distance)),
        offsets: [0, 1, 2].map(strand => weaveScale * threadShape(phase + (isRing ? sweep : .61) * u, strand)),
      };
    });
    return [id, { a, b, enabled, color, curve, samples }];
  }));
  const incident = new Map([...nodes.keys()].map(id => [id, []]));
  for (const [id, link] of links) {
    incident.get(link.a).push({ id, link, start: true });
    incident.get(link.b).push({ id, link, start: false });
  }
  const junctions = [];
  for (const [id, arms] of incident) {
    if (arms.length < 2) continue;
    const reach = (arms.length === 2 ? 12 : 21) * weaveScale;
    const node = nodes.get(id);
    const ports = arms.map(({ id, link, start }) => {
      const distance = sample => start ? sample.distance : link.curve.length - sample.distance;
      const samples = link.samples.map((sample, index) => ({ sample, index, distance: distance(sample) }));
      if (!start) samples.reverse();
      const target = Math.min(reach, link.curve.length * .30);
      const port = samples.find(({ distance }) => distance >= target);
      const blend = Math.min(11 * weaveScale, link.curve.length * .12);
      // Increasing strand index is the same side as rotation from the outward
      // tangent when a link starts here. Reverse that order when it ends here.
      const sign = start ? 1 : -1;
      const angle = Math.atan2(port.sample.y - node.y, port.sample.x - node.x);
      return { id, port, samples, blend, sign, angle };
    }).sort((a, b) => a.angle - b.angle);
    junctions.push({ id, ports });
  }
  return { nodes, links, junctions, isRing, weaveScale, cx, cy, radius };
}

function strokeCurve(ctx, curve, start, end, color, width) {
  const a = atFraction(curve, start);
  const b = atFraction(curve, end);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  for (const point of curve.points) {
    const fraction = point.distance / curve.length;
    if (fraction > start && fraction < end) ctx.lineTo(point.x, point.y);
  }
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function dot(ctx, x, y, radius, color) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, TURN);
  ctx.fillStyle = color;
  ctx.fill();
}

function arc(ctx, x, y, radius, start, end, color, width = 1) {
  ctx.beginPath();
  ctx.arc(x, y, radius, start, end);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function halo(ctx, x, y, radius, color, intensity) {
  const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
  glow.addColorStop(0, cssColor(color, intensity));
  glow.addColorStop(0.33, cssColor(color, intensity * 0.29));
  glow.addColorStop(1, cssColor(color, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}

function drawBackdrop(ctx, geometry, width, height) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, width, height);
  const { cx, cy, radius } = geometry;
  const ambient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.65);
  ambient.addColorStop(0, '#090D15');
  ambient.addColorStop(0.53, '#0A1019');
  ambient.addColorStop(0.65, '#0D1520');
  ambient.addColorStop(0.83, '#090F17');
  ambient.addColorStop(1, GROUND);
  ctx.fillStyle = ambient;
  ctx.fillRect(0, 0, width, height);

}

function strandPoint(sample, offset) {
  return { x: sample.x + sample.nx * offset, y: sample.y + sample.ny * offset };
}

function wakeOffset(sample, strand, opening) {
  return (strand - 1) * .33 + opening * sample.offsets[strand];
}

function setJunctionPoint(field, index, strand, point, amount) {
  const base = field.points[index][strand];
  field.points[index][strand] = { x: mix(base.x, point.x, amount), y: mix(base.y, point.y, amount) };
}

function blendPort(field, arm, strand, offset, amount) {
  for (const { sample, index, distance } of arm.samples) {
    if (distance < arm.port.distance) continue;
    if (distance >= arm.port.distance + arm.blend) break;
    const blend = ease((distance - arm.port.distance) / arm.blend);
    const point = strandPoint(sample, mix(offset, wakeOffset(sample, strand, field.samples[index].opening), blend));
    setJunctionPoint(field, index, strand, point, amount);
  }
}

function joinStrands(from, to, fromStrand, toStrand, offset, amount, fields, cleft = false) {
  const fromOffset = fromStrand === 1 ? 0 : from.sign * offset;
  const toOffset = toStrand === 1 ? 0 : -to.sign * offset;
  const a = strandPoint(from.port.sample, fromOffset);
  const b = strandPoint(to.port.sample, toOffset);
  const inward = ({ nx, ny }, sign) => ({ x: -sign * ny, y: sign * nx });
  const u = inward(from.port.sample, from.sign);
  const v = inward(to.port.sample, to.sign);
  const cross = (a, b) => a.x * b.y - a.y * b.x;
  const delta = { x: b.x - a.x, y: b.y - a.y };
  const denominator = cross(u, v);
  // For a tight cleft the two offset tangents meet before the node.
  // Use that meeting point to round the corner without looping the strands.
  const handleLength = (arm, tangent) => cleft && Math.abs(denominator) > .01
    ? Math.max(arm.port.distance * .15, Math.min(cross(delta, tangent) / denominator * .75, arm.port.distance * .83))
    : arm.port.distance * .67;
  const da = handleLength(from, v);
  const db = handleLength(to, u);
  const handleA = { x: a.x + u.x * da, y: a.y + u.y * da };
  const handleB = { x: b.x + v.x * db, y: b.y + v.y * db };
  for (const [arm, strand, offset, reverse] of [
    [from, fromStrand, fromOffset, false], [to, toStrand, toOffset, true],
  ]) {
    const field = fields.get(arm.id);
    for (const { index, distance } of arm.samples) {
      if (distance >= arm.port.distance) break;
      const half = (1 - distance / arm.port.distance) / 2;
      const point = cubicPosition(a, b, handleA, handleB, reverse ? 1 - half : half, 0);
      setJunctionPoint(field, index, strand, point, amount);
    }
    blendPort(field, arm, strand, offset, amount);
  }
}

function shapeJunctions(geometry, fields, nodes, time, reducedMotion) {
  for (const { id, ports } of geometry.junctions) {
    const arms = ports.filter(({ id }) => fields.get(id).enabled);
    if (arms.length < 2) continue;
    const opening = reducedMotion ? 0 : junctionOpening(nodes[id], time);
    if (geometry.isRing) {
      for (const arm of arms) {
        const field = fields.get(arm.id);
        for (const { sample, index, distance } of arm.samples) {
          if (distance >= arm.blend) break;
          const blend = ease(distance / arm.blend);
          const width = mix(opening, field.samples[index].opening, blend);
          field.points[index] = [0, 1, 2].map(strand => strandPoint(sample, wakeOffset(sample, strand, width)));
        }
      }
      continue;
    }
    if (opening === 0) continue;
    // As the opening closes, the strands return to the original curves.
    const amount = ease(clamp(opening / .38));
    const width = .33 + opening * 8.5 * geometry.weaveScale;
    // Each sector connects the facing rails of two consecutive arms.
    for (let i = 0; i < arms.length; i++) {
      const from = arms[i];
      const to = arms[(i + 1) % arms.length];
      const angle = (to.angle - from.angle + TURN) % TURN;
      const a = from.port.sample;
      const b = to.port.sample;
      // Facing rails share the available space in a narrow fork.
      const cleft = angle < Math.PI / 2;
      const offset = cleft ? Math.min(width, Math.hypot(a.x - b.x, a.y - b.y) * .4) : width;
      joinStrands(from, to, 1 + from.sign, 1 - to.sign, offset, amount, fields, cleft);
    }
    if (arms.length === 2) joinStrands(arms[0], arms[1], 1, 1, 0, amount, fields);
    else {
      for (const arm of arms) {
        const field = fields.get(arm.id);
        for (const { sample, index, distance } of arm.samples) {
          if (distance >= arm.port.distance) break;
          setJunctionPoint(field, index, 1, sample, amount);
        }
        blendPort(field, arm, 1, 0, amount);
      }
    }
  }
}

function drawWeave(ctx, link, { points, enabled }) {
  for (let strand = 0; strand < 3; strand++) {
    ctx.beginPath();
    let drawing = false;
    for (let i = 0; i < link.samples.length; i++) {
      const sample = link.samples[i];
      if (!enabled && Math.abs(sample.fraction - .5) * link.curve.length < Math.min(8, link.curve.length * .31)) {
        drawing = false;
        continue;
      }
      const { x, y } = points[i][strand];
      if (drawing) ctx.lineTo(x, y);
      else ctx.moveTo(x, y);
      drawing = true;
    }
    ctx.strokeStyle = cssColor(link.color, (strand === 1 ? .68 : .47) * (enabled ? 1 : .53));
    ctx.lineWidth = strand === 1 ? 1.08 : .8;
    ctx.stroke();
  }
}

function strokeLitStrands(ctx, a, b, tint, opacity) {
  for (let strand = 0; strand < 3; strand++) {
    const start = a[strand];
    const end = b[strand];
    ctx.beginPath();
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
    ctx.strokeStyle = cssColor(tint, opacity * (strand === 1 ? .85 : .7));
    ctx.lineWidth = 1.25;
    ctx.stroke();
  }
}

function drawWake(ctx, link, { samples, points }) {
  const tint = link.color === BRASS ? FLASH : COOL_FLASH;
  for (let i = 1; i < samples.length; i++) {
    const a = samples[i - 1];
    const b = samples[i];
    const intensity = Math.min(a.glow, b.glow);
    if (intensity < .01) continue;
    strokeLitStrands(ctx, points[i - 1], points[i], tint, intensity);
  }
}

function drawDissipation(ctx, geometry, fields, event, age) {
  const collision = event.type === 'conduction_collision';
  const linkIds = collision ? [event.linkId] : event.incomingLinkIds;
  const spread = 16 + 6 * clamp(age / 35);
  const envelope = (.6 + .4 * clamp(age / 5)) * (1 - age / GLYPH_LIFETIME) ** 1.8;
  for (const id of linkIds) {
    const link = geometry.links.get(id);
    const field = fields.get(id);
    if (!link || !field?.enabled) continue;
    const center = collision ? event.position : (event.nodeId === link.a ? 0 : 1);
    for (let i = 1; i < link.samples.length; i++) {
      const a = link.samples[i - 1];
      const b = link.samples[i];
      const distance = Math.abs((a.fraction + b.fraction) / 2 - center) * link.curve.length;
      if (distance >= spread) continue;
      const opacity = envelope * Math.cos(distance / spread * Math.PI / 2) ** 2;
      ctx.shadowColor = cssColor(ICE, opacity * .7);
      ctx.shadowBlur = 7;
      strokeLitStrands(ctx, field.points[i - 1], field.points[i], COOL_FLASH, opacity);
    }
  }
  ctx.shadowBlur = 0;
}

function drawTransit(ctx, link, transit, tMs, reducedMotion) {
  const progress = (tMs - transit.departureMs) / (transit.arrivalMs - transit.departureMs);
  if (progress < 0 || progress >= 1) return;
  if (reducedMotion) {
    strokeCurve(ctx, link.curve, 0, 1, cssColor(link.color, 0.83), 1.5);
    const endpoint = atFraction(link.curve, transit.fromNodeId === link.a ? 0 : 1);
    dot(ctx, endpoint.x, endpoint.y, 1.9, cssColor(link.color, 0.92));
    return;
  }
  const forward = transit.fromNodeId === link.a;
  const head = atFraction(link.curve, forward ? progress : 1 - progress);
  halo(ctx, head.x, head.y, 13, link.color, 0.49);
  dot(ctx, head.x, head.y, 2.4, link.color === BRASS ? FLASH : COOL_FLASH);
}

function drawNode(ctx, node, state) {
  const { x, y, color } = node;
  const recovery = ease(clamp(state?.recovery ?? 1));
  const excitable = state?.excitable ?? true;
  const edge = excitable ? 0.23 : 0.13;
  const core = color === BRASS ? FLASH : COOL_FLASH;
  if (node.silent) {
    // Silent tissue (audible: false) is an open ring, as in the Ladder view.
    dot(ctx, x, y, 3.6, GROUND);
    halo(ctx, x, y, 9, color, 0.05 + recovery * 0.14);
    arc(ctx, x, y, 3.4 + recovery * 0.9, 0, TURN, cssColor(color, 0.3 + recovery * 0.34), 0.8);
    return;
  }
  dot(ctx, x, y, 2.8, GROUND);
  halo(ctx, x, y, 11.5, color, 0.10 + recovery * 0.30);
  arc(ctx, x, y, 4.3 + recovery * 1.5, 0, TURN, cssColor(color, edge + recovery * 0.24), 0.72);
  dot(ctx, x, y, 1.27 + recovery * 1.19, cssColor(color, 0.37 + recovery * 0.63));
  if (recovery > 0) dot(ctx, x - 0.42, y - 0.51, 0.72, cssColor(core, recovery * 0.91));
}

function drawEvent(ctx, geometry, event, tMs, reducedMotion, fields) {
  const age = tMs - event.tMs;
  const node = geometry.nodes.get(event.nodeId);
  const collision = event.type === 'conduction_collision';
  const meeting = event.type === 'activation' && (event.incomingLinkIds?.length ?? 0) > 1;
  const conductionBlock = event.type === 'activation_blocked' && event.incomingLinkIds.length > 0;
  if (!reducedMotion && (collision || meeting || conductionBlock)) {
    drawDissipation(ctx, geometry, fields, event, age);
    if (!meeting) return;
  }
  if (event.type === 'activation' && age < 54 && node) {
    const t = age / 54;
    const flash = (1 - t) ** 2.7;
    const color = node.color === BRASS ? FLASH : COOL_FLASH;
    halo(ctx, node.x, node.y, 17, color, 0.78 * flash);
    dot(ctx, node.x, node.y, 3.1, cssColor(color, flash));
    arc(ctx, node.x, node.y, reducedMotion ? 9 : 7.5 + 11 * ease(t), 0, TURN,
      cssColor(color, 0.85 * (1 - t) ** 1.6), 0.95);
  }
  if (event.type === 'activation_blocked' && node) {
    const { x, y, angle } = node;
    const toward = event.incomingLinkIds.map((id) => {
      const link = geometry.links.get(id);
      if (!link) return null;
      const near = atFraction(link.curve, link.a === event.nodeId ? 0.12 : 0.88);
      return Math.atan2(near.y - y, near.x - x);
    }).filter((direction) => direction !== null);
    if (toward.length === 0) toward.push(angle);
    const distance = reducedMotion ? 0 : 5 * ease(age / GLYPH_LIFETIME);
    const opacity = (1 - age / GLYPH_LIFETIME) ** 1.6;
    for (const direction of toward) {
      arc(ctx, x, y, 8.2 + distance, direction - 0.53, direction + 0.53, cssColor(COOL_FLASH, 0.92 * opacity), 1.2);
      arc(ctx, x, y, 12.4 + distance, direction - 0.43, direction + 0.43, cssColor(COOL_FLASH, 0.7 * opacity), 1);
    }
  }
  if (event.type === 'conduction_collision' || event.type === 'conduction_canceled') {
    const link = geometry.links.get(event.linkId);
    if (!link) return;
    const { x, y } = atFraction(link.curve, event.position);
    const t = age / GLYPH_LIFETIME;
    const opacity = (1 - t) ** 1.8;
    if (event.type === 'conduction_collision') {
      const radius = reducedMotion ? 6.2 : 4.4 + ease(t) * 8;
      arc(ctx, x, y, radius, 0, TURN, cssColor(COOL_FLASH, opacity * 0.92), 1.05);
      halo(ctx, x, y, 12, FLASH, opacity * 0.31);
    } else {
      arc(ctx, x, y, 5.6, -1.39, -0.02, cssColor(INPUT, opacity * 0.66));
      arc(ctx, x, y, 5.6, 1.75, 3.12, cssColor(INPUT, opacity * 0.66));
    }
  }
}

// Small open ring beside an element whose parameters differ from the study default.
function drawModified(ctx, x, y) {
  arc(ctx, x, y, 3.1, 0, TURN, cssColor(FLASH, 0.78), 0.9);
}

function createRenderer(canvas, world, { reducedMotion = false, layout = null } = {}) {
  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) throw new Error('Counterpoint requires Canvas 2D.');
  const backdropCanvas = canvas.ownerDocument.createElement('canvas');
  const backdrop = backdropCanvas.getContext('2d', { alpha: false });
  if (!backdrop) throw new Error('Counterpoint requires a Canvas 2D backdrop.');
  const gestures = new Map();
  let geometry;
  let width = 1;
  let height = 1;
  let ratio = 1;
  let backdropDirty = true;
  const weaveHistory = createWeaveHistory();
  let network;
  let overlay = null;
  let modified = { nodes: new Set(), links: new Set() };
  let selected = null;

  // Adapter the Study No. 2 marks (marks.js) use to reach this renderer's geometry.
  const adapter = {
    nodePoint: (id) => { const node = geometry.nodes.get(id); return node ? { x: node.x, y: node.y } : null; },
    linkColor: (id) => geometry.links.get(id)?.color ?? BRASS,
    linkPoint: (id, u) => { const link = geometry.links.get(id); return link ? atFraction(link.curve, u) : null; },
    strokeLink: (ctx, id, u0, u1, color, lineWidth, alpha) => {
      const link = geometry.links.get(id);
      if (!link) return;
      ctx.globalAlpha = alpha ?? 1;
      strokeCurve(ctx, link.curve, clamp(Math.min(u0, u1)), clamp(Math.max(u0, u1)), color, lineWidth);
      ctx.globalAlpha = 1;
    },
  };

  function resize(cssWidth, cssHeight, dpr) {
    const size = canvas.getBoundingClientRect();
    const nextWidth = Math.max(1, cssWidth ?? size.width);
    const nextHeight = Math.max(1, cssHeight ?? size.height);
    const nextRatio = Math.min(2, Math.max(1, dpr ?? canvas.ownerDocument.defaultView?.devicePixelRatio ?? 1));
    if (geometry && width === nextWidth && height === nextHeight && ratio === nextRatio) return;
    width = nextWidth;
    height = nextHeight;
    ratio = nextRatio;
    backdropCanvas.width = canvas.width = Math.round(width * ratio);
    backdropCanvas.height = canvas.height = Math.round(height * ratio);
    geometry = makeGeometry(world, width, height, layout);
    network = createNetworkMarks({ world, geometry: adapter, reducedMotion });
    backdropDirty = true;
  }

  function render(snapshot, events = [], tMs = snapshot.tMs) {
    if (backdropDirty) {
      backdrop.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawBackdrop(backdrop, geometry, width + 1, height + 1);
      backdropDirty = false;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(backdropCanvas, 0, 0);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineCap = 'round';

    const history = !reducedMotion && weaveHistory(events, snapshot.runId);
    const fields = new Map();
    for (const [id, link] of geometry.links) {
      const state = snapshot.links[id];
      const enabled = state?.enabled ?? link.enabled;
      const erpA = snapshot.nodes[link.a]?.erpMs ?? 0;
      const erpB = snapshot.nodes[link.b]?.erpMs ?? 0;
      const passages = history ? pathPassages(history, snapshot.activeTransits, id, tMs,
        Math.max(erpA, erpB), state?.generation).filter(({ launch }) =>
          !network.isConcealedTransit(events, launch.transitId)) : [];
      const samples = link.samples.map(({ fraction }) =>
        sampleWeave(passages, link.a, fraction, tMs, mix(erpA, erpB, fraction)));
      const points = link.samples.map((sample, index) => [0, 1, 2].map(strand =>
        strandPoint(sample, sample.taper * wakeOffset(sample, strand, samples[index].opening))));
      fields.set(id, { enabled, samples, points, hasWake: passages.length > 0 });
    }
    shapeJunctions(geometry, fields, snapshot.nodes, tMs, reducedMotion);
    for (const [id, link] of geometry.links) {
      const field = fields.get(id);
      drawWeave(ctx, link, field);
      if (field.enabled && field.hasWake) drawWake(ctx, link, field);
    }

    for (const [id, node] of geometry.nodes) drawNode(ctx, node, snapshot.nodes[id]);
    // The selected site (last touched or inspected) wears a quiet gold halo.
    const chosen = selected ? geometry.nodes.get(selected) : null;
    if (chosen) {
      arc(ctx, chosen.x, chosen.y, 15, 0, TURN, cssColor('#d6b880', 0.85), 1.2);
      arc(ctx, chosen.x, chosen.y, 19.5, 0, TURN, cssColor('#d6b880', 0.25), 0.8);
    }
    for (const id of modified.nodes) {
      const node = geometry.nodes.get(id);
      if (node) drawModified(ctx, node.x + 9, node.y - 9);
    }
    for (const id of modified.links) {
      const link = geometry.links.get(id);
      if (!link) continue;
      const point = atFraction(link.curve, 0.5);
      drawModified(ctx, point.x, point.y);
    }
    for (const transit of snapshot.activeTransits) {
      const link = geometry.links.get(transit.linkId);
      if (link && !network.drawConcealedTransit(ctx, transit, tMs, events)) drawTransit(ctx, link, transit, tMs, reducedMotion);
    }

    // History is ordered by time and may include the committed lookahead.
    for (let i = events.length - 1; i >= 0; i -= 1) {
      const event = events[i];
      if (event.tMs > tMs || event.runId !== snapshot.runId) continue;
      if (event.tMs <= tMs - GLYPH_LIFETIME) break;
      if (!(event.type === 'activation_blocked' && network.isConcealedBlock(events, event.eventId))) {
        drawEvent(ctx, geometry, event, tMs, reducedMotion, fields);
      }
      if (event.type === 'stimulus_attempted') gestures.delete(event.triggerId);
    }
    network.draw(ctx, tMs, events);
    ctx.globalAlpha = 1;
    for (const [commandId, gesture] of gestures) {
      if (gesture.runId !== snapshot.runId || tMs >= gesture.targetMs) {
        gestures.delete(commandId);
        continue;
      }
      const node = geometry.nodes.get(gesture.nodeId);
      ctx.setLineDash([1.2, 3.5]);
      arc(ctx, node.x, node.y, 15, 0, TURN, cssColor(INPUT, 0.74));
      ctx.setLineDash([]);
    }
    overlay?.(ctx, { tMs, snapshot, events, width, height });
  }

  function hitTest(x, y) {
    let closest = null;
    let limit = HIT_RADIUS;
    for (const [id, node] of geometry.nodes) {
      const distance = Math.hypot(x - node.x, y - node.y);
      if (distance <= limit) {
        closest = id;
        limit = distance;
      }
    }
    return closest;
  }

  // Nearest link within a few pixels of its filament, away from the sites.
  function hitTestLink(x, y, tolerance = 12) {
    let closest = null;
    let limit = tolerance;
    for (const [id, link] of geometry.links) {
      const from = geometry.nodes.get(link.a);
      const to = geometry.nodes.get(link.b);
      if (!awayFromNodes(x, y, from, to, HIT_RADIUS)) continue;
      for (const point of link.curve.points) {
        const distance = Math.hypot(x - point.x, y - point.y);
        if (distance <= limit) {
          closest = id;
          limit = distance;
        }
      }
    }
    return closest;
  }

  function nodePosition(nodeId) {
    const node = geometry.nodes.get(nodeId);
    return node ? { x: node.x, y: node.y } : null;
  }

  function crossedLinks(start, end, previousSample) {
    const x = end.x - start.x;
    const y = end.y - start.y;
    const length = Math.hypot(x, y);
    if (!Number.isFinite(length) || length <= CROSSING_EPSILON) return [];
    const incomingLength = previousSample && Math.hypot(start.x - previousSample.x, start.y - previousSample.y);

      const y = layer.labelOffset < 0 ? box.top + box.height + layer.labelOffset
        : layer.labelY === undefined ? box.top + (layer.labelOffset ?? 12) : layout.py(layer.labelY);
      layout.deferred.push(() => {
        const size = 12.5;
        font(ctx, size, { italic: true, serif: true });
        const width = ctx.measureText(layer.label).width;
        const right = box.left + box.width;
        const rightOfLine = x + 4;
        const leftOfLine = x - 4 - width;
        const start = rightOfLine + width > right && leftOfLine >= box.left
          ? leftOfLine : Math.max(box.left, Math.min(rightOfLine, right - width));
        label(ctx, layer.label, start, y, { size, alpha: 0.85 });
      });
    }
  },
  hline(ctx, layer, layout) {
    const y = layout.py(layer.y);
    const { box } = layout;
    if (y < box.top || y > box.top + box.height) return;
    ctx.save();
    ctx.setLineDash(layer.dash ?? []);
    ctx.strokeStyle = withAlpha(layer.color ?? S.text2, layer.alpha ?? 0.45);
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(box.left, y);
    ctx.lineTo(box.left + box.width, y);
    ctx.stroke();
    ctx.restore();
    if (layer.label) label(ctx, layer.label, box.left + box.width + 5, y, { size: 12.5 });
  },
  band(ctx, layer, layout) {
    const a = layout.px(layer.x0);
    const b = layout.px(layer.x1);
    const { box } = layout;
    ctx.fillStyle = withAlpha(layer.color ?? S.blue, layer.alpha ?? 0.08);
    ctx.fillRect(Math.min(a, b), box.top, Math.abs(b - a), box.height);
    if (layer.label) label(ctx, layer.label, (a + b) / 2, box.top + box.height - 12, { size: 12, align: 'center', alpha: 0.8 });
  },
  text(ctx, layer, layout) {
    label(ctx, layer.text, layout.px(layer.x), layout.py(layer.y), { color: layer.color ?? S.text, size: layer.size ?? 13, align: layer.align ?? 'left', italic: layer.italic ?? true, serif: layer.serif ?? true });
  },
  stems(ctx, layer, layout) {
    for (const stem of layer.stems) {
      const x = layout.px(stem.x);
      ctx.strokeStyle = withAlpha(stem.color, 0.9);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, layout.py(0));
      ctx.lineTo(x, layout.py(stem.y));
      ctx.stroke();
      pearl(ctx, x, layout.py(stem.y), stem.color, stem.color === S.gold ? S.goldCore : S.blueCore, 2.8);
      layout.deferred.push(() => label(ctx, stem.label, x, layout.box.top + layout.box.height + 8, { color: S.text2, size: 10.5, italic: false, serif: false, baseline: 'top', align: 'center', alpha: 1 }));
    }
  },
};

function drawHandles(ctx, model, layout, active) {
  for (const handle of model.handles ?? []) {
    const x = layout.px(handle.x);
    const y = layout.py(handle.y);
    const on = handle.id === active;
    const color = handle.color ?? S.blueCore;
    if (on) dot(ctx, x, y, 11, color, 0.12);
    ctx.beginPath();
    ctx.arc(x, y, on ? 5.5 : 4.6, 0, Math.PI * 2);
    ctx.fillStyle = S.background;
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = on ? 1.8 : 1.2;
    ctx.stroke();
    if (handle.label) {
      const right = x > layout.box.left + layout.box.width * 0.7;
      label(ctx, handle.label, x + (right ? -10 : 10), y + (right ? -13 : 14), { color: handle.labelColor ?? S.text, size: 12.5, align: right ? 'right' : 'left' });
    }
  }
}

// Draws a model into rect. options: { activeHandle, background: true }.
function drawPlot(ctx, model, rect, options = {}) {
  ctx.save();
  if (options.background !== false) {
    ctx.fillStyle = S.background;
    ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
  }
  // A compact model (inside a card that already names it) shows only its subtitle.
  if (!model.compact) label(ctx, model.title, rect.x + 4, rect.y + 14, { size: 17, color: S.text, alpha: 1 });
  if (model.subtitle) label(ctx, model.subtitle, rect.x + 4, rect.y + (model.compact ? 10 : 34), { size: 10.5, italic: false, serif: false, color: S.text2, alpha: 1 });
  const layout = { ...plotLayout(model, rect), deferred: [] };
  drawAxes(ctx, model, layout);
  ctx.save();
  ctx.beginPath();
  ctx.rect(layout.box.left, layout.box.top - 6, layout.box.width + 80, layout.box.height + 12);
  ctx.clip();
  for (const layer of model.layers) LAYER[layer.type](ctx, layer, layout);
  ctx.restore();
  for (const draw of layout.deferred) draw();
  // Unclipped: category labels and handles may sit on the frame.
  drawHandles(ctx, model, layout, options.activeHandle ?? null);
  (model.footer ?? []).forEach((line, index) => {
    label(ctx, line.text, rect.x + 4, layout.footerTop + 8 + index * FOOTER_LINE, { size: 11, italic: false, serif: false, color: line.strong ? S.text : S.text2, alpha: 1 });
  });
  ctx.restore();
  return layout;
}

// ---------------------------------------------------------------------------
// Model helpers

function extent(values, pad = 0.08, floor = null) {
  const finite = values.filter(Number.isFinite);
  if (finite.length === 0) return [0, 1];
  let lo = Math.min(...finite);
  let hi = Math.max(...finite);
  if (hi - lo < 1e-9) {
    lo -= 1;
    hi += 1;
  }
  const span = hi - lo;
  lo -= span * pad;
  hi += span * pad;
  if (floor !== null) lo = Math.max(floor, lo);
  return [lo, hi];
}

const ms = value => (value === null || value === undefined ? '—' : `${round3(value)} ms`);
const sample = (lo, hi, n, f) => Array.from({ length: n + 1 }, (_, i) => {
  const x = lo + ((hi - lo) * i) / n;
  return [x, f(x)];
});

function entry(id, title, build) {
  return Object.freeze({
    id,
    title,
    build,
    draw: (ctx, model, rect, options) => drawPlot(ctx, model, rect, options),
    table: model => model.table,
    summary: model => model.summary,
  });
}

// ---------------------------------------------------------------------------
// Refractory restitution (site inspector)

// law: §A parameters or null (fixed ERP erpMs). dots: measure.restitutionDots.
// live: { diMs } for the current diastolic interval, or null.
// sinceMs: captures before the last edit of this site were made under other
// parameters; they are drawn faint and left out of the on-curve count.
function restitutionModel({ siteLabel, law = null, erpMs = null, dots: allDots = [], live = null, diMaxMs = 600, sinceMs = null }) {
  // Captures before the player's last edit of this site no longer describe the
  // model, so they are dropped (creator decision 2026-11-27), not greyed out.
  const dots = sinceMs === null ? allDots : allDots.filter(d => d.tMs >= sinceMs);
  const f = di => (law === null ? erpMs : Math.min(law.erpMaxMs, Math.max(law.erpMinMs, law.erpMaxMs - law.amplitudeMs * Math.exp(-di / law.tauMs))));
  const xMax = Math.max(diMaxMs, ...allDots.map(d => d.diMs).filter(Number.isFinite).map(v => Math.min(v, 3000)));
  const curve = sample(0, xMax, 240, f);
  const yValues = [...curve.map(p => p[1]), ...allDots.map(d => d.erpMs)];
  let yDomain = extent(yValues, 0.14);
  if (law !== null && law.erpMinMs > yDomain[0] - 30 && law.erpMinMs < yDomain[0]) yDomain = [law.erpMinMs - 8, yDomain[1]];
  const layers = [{ type: 'line', points: curve, color: S.gold, width: 1.3, glow: true }];
  if (law !== null && law.erpMinMs >= yDomain[0] && law.erpMinMs < law.erpMaxMs - law.amplitudeMs) {
    layers.push({ type: 'hline', y: law.erpMinMs, dash: [3, 3], color: S.text2, alpha: 0.5 });
  }
  const recent = dots.slice(-120);
  layers.push({ type: 'dots', points: recent.map(d => [d.diMs, d.erpMs]), color: S.gold, radius: 4, fade: true, fadeFloor: 0.5, halo: true, haloAlpha: 0.18, outline: true });
  let liveErp = null;
  if (live && Number.isFinite(live.diMs)) {
    liveErp = f(Math.max(0, live.diMs));
    layers.push({ type: 'pearl', point: [Math.min(live.diMs, xMax), liveErp], label: 'now' });
  }
  const handles = law === null
    ? [{ id: 'erp', param: 'erpMs', axis: 'y', x: xMax, y: erpMs, value: erpMs, label: 'ERP' }]
    : [
      { id: 'erpMax', param: 'erpMaxMs', axis: 'y', x: xMax, y: law.erpMaxMs, value: law.erpMaxMs, label: 'E max' },
      { id: 'amplitude', param: 'amplitudeMs', axis: 'y', x: 0, y: law.erpMaxMs - law.amplitudeMs, value: law.amplitudeMs, label: 'E max − A', invert: true },
      { id: 'tau', param: 'tauMs', axis: 'x', x: law.tauMs, y: law.erpMaxMs - law.amplitudeMs / E, value: law.tauMs, label: 'tau' },
    ];
  if (law !== null && law.erpMinMs >= yDomain[0]) {
    handles.push({ id: 'erpMin', param: 'erpMinMs', axis: 'y', x: xMax * 0.8, y: law.erpMinMs, value: law.erpMinMs, label: 'E min' });
  }
  const slope = law === null || !live ? null : restitutionSlope(law, Math.max(0, live.diMs));
  const footer = law === null
    ? [{ text: `ERP  ${ms(erpMs)}  (no restitution)`, strong: true }]
    : [
      { text: `E max  ${ms(law.erpMaxMs)}     A  ${ms(law.amplitudeMs)}     tau  ${ms(law.tauMs)}     E min  ${ms(law.erpMinMs)}`, strong: true },
      { text: `${slope === null ? 'slope —' : `slope at current DI  ${slope.toFixed(2)}`}   ·   alternans needs slope > 1` },
    ];
  const lawAt = di => round3(f(di));
  const tableRows = dots.map(d => [round3(d.tMs), d.diMs, d.erpMs, lawAt(d.diMs)]);
  const off = dots.filter(d => Math.abs(d.erpMs - lawAt(d.diMs)) > 0.0015).length;
  const summary = law === null
    ? `${siteLabel}: fixed ERP of ${ms(erpMs)}; ${dots.length} captures.`
    : `${siteLabel}: ERP ${ms(law.erpMaxMs)} after a long rest, shortening by up to ${ms(law.amplitudeMs)} with tau ${ms(law.tauMs)}; ${dots.length === 0 && sinceMs !== null && sinceMs > 0 ? 'no captures yet since the last edit' : `${dots.length - off} of ${dots.length} captures${sinceMs !== null && sinceMs > 0 ? ' since the last edit' : ''} lie on the curve`}${liveErp === null ? '' : `; now ${ms(Math.round(liveErp))}`}.`;
  return {
    kind: 'restitution',
    title: `Site · ${siteLabel}`,
    subtitle: 'Refractory restitution · drag the handles or type values',
    xLabel: 'diastolic interval (ms)',
    yLabel: 'ERP (ms)',
    xDomain: [-xMax * 0.025, xMax * 1.03],
    yDomain,
    layers,
    handles,
    footer,
    law,
    live: liveErp === null ? null : { diMs: live.diMs, erpMs: liveErp },
    table: { caption: `Captures at ${siteLabel}`, columns: ['time (ms)', 'DI (ms)', 'ERP engine (ms)', 'ERP law (ms)'], rows: tableRows },
    summary,
  };
}

// ---------------------------------------------------------------------------
// Alternans cobweb at a fixed drive cycle

function cobwebModel({ siteLabel, law, cycleMs, erps }) {
  const map = erp => Math.min(law.erpMaxMs, Math.max(law.erpMinMs, law.erpMaxMs - law.amplitudeMs * Math.exp(-(cycleMs - erp) / law.tauMs)));
  const lo = Math.max(law.erpMinMs, Math.min(...erps, law.erpMaxMs - law.amplitudeMs) - 10);
  const hi = law.erpMaxMs + 8;
  const path = [];
  for (let i = 0; i + 1 < erps.length; i++) {
    path.push([erps[i], erps[i]], [erps[i], erps[i + 1]]);
  }
  const tail = erps.slice(-6);
  const alternating = tail.length >= 4 && Math.abs(tail[tail.length - 1] - tail[tail.length - 2]) > 5 && Math.abs(tail[tail.length - 1] - tail[tail.length - 3]) < 1;
  return {
    kind: 'cobweb',
    title: `Alternans · ${siteLabel}`,
    subtitle: `ERP(n) against ERP(n+1) at a fixed drive of ${cycleMs} ms`,
    xLabel: 'ERP n (ms)',
    yLabel: 'ERP n+1 (ms)',
    xDomain: [lo, hi],
    yDomain: [lo, hi],
    square: true,
    layers: [
      { type: 'line', points: [[lo, lo], [hi, hi]], color: S.rule, width: 1 },
      { type: 'line', points: sample(lo, hi, 160, map), color: S.gold, width: 1.2, glow: true },
      { type: 'line', points: path, color: S.blue, width: 0.8, alpha: 0.7 },
      { type: 'dots', points: erps.slice(0, -1).map((e, i) => [e, erps[i + 1]]), color: S.blueCore, radius: 2, fade: true },
    ],
    table: { caption: `ERP sequence at ${siteLabel}`, columns: ['beat', 'ERP n (ms)', 'ERP n+1 (ms)'], rows: erps.slice(0, -1).map((e, i) => [i + 1, e, erps[i + 1]]) },
    summary: alternating
      ? `At ${cycleMs} ms the ERP alternates between ${ms(tail[tail.length - 2])} and ${ms(tail[tail.length - 1])}.`
      : `At ${cycleMs} ms the ERP settles at ${ms(tail[tail.length - 1])}.`,
  };
}

// ---------------------------------------------------------------------------
// Conduction restitution and decrement (link inspector)

// delayMs: the direction's current delay (with lesion); decrement and entry: laws or null.
// dots: measure.conductionDots for this direction.
function conductionModel({ linkLabel, delayMs, decrement = null, entry = null, dots: allDots = [], live = null, xMaxMs = 700, sinceMs = null }) {
  // Launches before the last edit of this link are dropped (see restitutionModel).
  const dots = sinceMs === null ? allDots : allDots.filter(d => d.tMs >= sinceMs);
  const main = x => delayMs + (decrement ? decrement.maxExtraMs * Math.exp(-x / decrement.tauMs) : 0);
  const entryLine = x => delayMs + (entry ? entry.maxExtraMs * Math.exp(-x / entry.tauMs) : 0);
  const sourceDots = dots.filter(d => d.recoveryMs !== null).map(d => [Math.min(d.recoveryMs, xMaxMs), d.parts ? d.parts.baseMs + d.parts.lesionMs + d.parts.sourceMs : d.totalMs]);
  const entryDots = entry ? dots.filter(d => d.slackMs !== null && d.parts).map(d => [Math.min(d.slackMs, xMaxMs), d.parts.baseMs + d.parts.lesionMs + d.parts.entryMs]) : [];
  const top = delayMs + Math.max(decrement?.maxExtraMs ?? 0, entry?.maxExtraMs ?? 0);
  const yDomain = extent([delayMs, top, ...sourceDots.map(p => p[1]), ...entryDots.map(p => p[1])], 0.12);
  const layers = [{ type: 'line', points: sample(0, xMaxMs, 240, main), color: S.blue, width: 1.2, glow: true }];
  if (entry) layers.push({ type: 'line', points: sample(0, xMaxMs, 240, entryLine), color: S.blue, width: 0.9, alpha: 0.6, dash: [4, 4] });
  if (entryDots.length) layers.push({ type: 'dots', points: entryDots.slice(-150), color: S.blueCore, radius: 3.6, hollow: true, lineWidth: 1.6, fade: true, fadeFloor: 0.5 });
  layers.push({ type: 'dots', points: sourceDots.slice(-150), color: S.gold, radius: 3.8, halo: true, haloAlpha: 0.18, outline: true });
  if (live && Number.isFinite(live.recoveryMs)) layers.push({ type: 'pearl', point: [Math.min(live.recoveryMs, xMaxMs), main(live.recoveryMs)], label: 'now' });
  const handles = [{ id: 'delay', param: 'delayMs', axis: 'y', x: xMaxMs, y: delayMs, value: delayMs, label: 'delay' }];
  if (decrement) {
    handles.push(
      { id: 'decrementMax', param: 'decrement.maxExtraMs', axis: 'y', x: 0, y: delayMs + decrement.maxExtraMs, value: decrement.maxExtraMs, label: 'decrement', offset: delayMs },
      { id: 'decrementTau', param: 'decrement.tauMs', axis: 'x', x: decrement.tauMs, y: delayMs + decrement.maxExtraMs / E, value: decrement.tauMs, label: 'tau' },
    );
  }
  if (entry) {
    handles.push(
      { id: 'entryMax', param: 'entry.maxExtraMs', axis: 'y', x: xMaxMs * 0.02, y: delayMs + entry.maxExtraMs, value: entry.maxExtraMs, label: 'entry', offset: delayMs, color: S.blue },
      { id: 'entryTau', param: 'entry.tauMs', axis: 'x', x: entry.tauMs, y: delayMs + entry.maxExtraMs / E, value: entry.tauMs, label: 'entry tau', color: S.blue },
    );
  }
  const describe = law => (law ? `${ms(law.maxExtraMs)} · tau ${ms(law.tauMs)}` : 'none');
  const rows = dots.map(d => [round3(d.tMs), d.recoveryMs, d.parts?.sourceMs ?? null, d.slackMs, d.parts?.entryMs ?? null, d.totalMs]);
  const onLaw = dots.filter(d => d.parts && d.recoveryMs !== null && Math.abs(d.parts.sourceMs - decrementExtra(decrement, d.recoveryMs)) <= 0.0015).length;
  return {
    kind: 'conduction',
    title: `Link · ${linkLabel}`,
    subtitle: 'Conduction time against recovery · line = law, dots = engine',
    xLabel: 'recovery since ERP ended (ms)',
    yLabel: 'conduction time (ms)',
    xDomain: [-xMaxMs * 0.015, xMaxMs * 1.015],
    yDomain,
    layers,
    handles,
    footer: [
      { text: `delay ${ms(delayMs)}  ·  decrement ${describe(decrement)}`, strong: true },
      ...(entry ? [{ text: `entry ${describe(entry)}`, strong: true }] : []),
      { text: entry ? 'Open dots: entry against the destination\'s slack.' : 'Dots: base delay plus source decrement per launch.' },
    ],
    table: { caption: `Launches on ${linkLabel}`, columns: ['departure (ms)', 'recovery (ms)', 'decrement (ms)', 'slack (ms)', 'entry (ms)', 'total (ms)'], rows },
    summary: `${linkLabel}: ${ms(delayMs)} base, decrement ${describe(decrement)}, entry ${describe(entry)}; ${dots.length} launches${decrement ? `, ${onLaw} on the decrement curve` : ''}${sinceMs !== null && sinceMs > 0 ? ' since the last edit' : ''}.`,
  };
}

// ---------------------------------------------------------------------------
// S1–S2 curves

function couplingKey(result) {
  return result.columns.includes('s3Ms') && typeof result.protocol.s3 === 'object' ? 's3Ms' : 's2Ms';
}

function splitAtJump(points, jump) {
  if (!jump) return [points, []];
  return [points.filter(p => p[0] > jump.couplingMs), points.filter(p => p[0] <= jump.couplingMs)];
}

function s1s2ConductionModel(result, { atriumLabel = 'septal atrium', outputLabel = 'His' } = {}) {
  const key = couplingKey(result);
  const points = result.rows.filter(r => r.a2h2Ms !== null).map(r => [r[key], r.a2h2Ms]);
  const jump = result.summary.jump;
  const [before, after] = splitAtJump(points, jump);
  const xs = result.rows.map(r => r[key]);
  const layers = [];
  for (const [segment, color] of [[before, S.gold], [after, S.blue]]) {
    if (!segment.length) continue;
    layers.push({ type: 'line', points: segment, color, width: 0.9, alpha: 0.6, glow: true });
    layers.push({ type: 'dots', points: segment, color, radius: 2.1 });
  }
  if (jump) {
    layers.push({ type: 'line', points: [[jump.fromCouplingMs, jump.fromMs], [jump.couplingMs, jump.toMs]], color: S.text, width: 0.7, alpha: 0.6, dash: [2, 2] });
    layers.push({ type: 'text', x: jump.couplingMs - (Math.max(...xs) - Math.min(...xs)) * 0.02, y: (jump.fromMs + jump.toMs) / 2, text: `+${Math.round(jump.jumpMs)} ms`, size: 14 });
  }
  const yDomain = extent(points.map(p => p[1]), 0.12);
  return {
    kind: 's1s2Conduction',
    title: 'S1–S2 · the jump',
    subtitle: `${atriumLabel} to ${outputLabel} · Drive ${result.protocol.driveCycleMs} ms`,
    xLabel: `A1–A2 (ms)`,
    yLabel: `A2–H2 (ms)`,
    xDomain: extent(points.map(p => p[0]), 0.03),
    yDomain,
    invertX: true,
    layers,
    table: { caption: 'S1–S2 conduction curve', columns: ['A1–A2 (ms)', 'A2–H2 (ms)'], rows: points },
    summary: jump ? `Jump of ${Math.round(jump.jumpMs)} ms at ${jump.couplingMs} ms.` : 'No jump: conduction time rises smoothly.',
  };
}

function s1s2OutputModel(result, { output = 'h1h2Ms', outputLabel = 'H1–H2', erpSites = null } = {}) {
  const key = couplingKey(result);
  const points = result.rows.filter(r => r[output] !== null).map(r => [r[key], r[output]]);
  const jump = result.summary.jump;
  const [before, after] = splitAtJump(points, jump);
  const xs = result.rows.map(r => r[key]);
  const xDomain = extent([...xs, ...points.map(p => p[0])], 0.04);
  const yDomain = extent(points.map(p => p[1]), 0.1);
  const layers = [{ type: 'line', points: [[xDomain[0], xDomain[0]], [xDomain[1], xDomain[1]]], color: S.rule, width: 1 }];
  for (const [segment, color] of [[before, S.gold], [after, S.blue]]) {
    if (!segment.length) continue;
    layers.push({ type: 'line', points: segment, color, width: 0.8, alpha: 0.45, glow: true });
    layers.push({ type: 'dots', points: segment, color, radius: 2.2 });
  }
  const erps = Object.entries(result.summary.erps).filter(([id]) => erpSites === null || erpSites.includes(id));
  const sorted = erps.sort((a, b) => b[1].erpMs - a[1].erpMs);
  sorted.forEach(([, erp], index) => {
    // Use fixed row spacing so nearby thresholds stay legible as the plot resizes.
    const labelOffset = index === 0 ? 12 : -(12 + 16 * (sorted.length - 1 - index));
    layers.push({ type: 'vline', x: erp.erpMs, label: `${erp.label} ERP`, labelOffset });
  });
  const frp = result.summary.frp;
  const text = [
    ...sorted.map(([, erp]) => `${erp.label} ERP ${erp.erpMs}–${erp.upperMs ?? '?'} ms`),
    frp ? `FRP ${ms(frp.frpMs)}` : null,
  ].filter(Boolean);
  return {
    kind: 's1s2Output',
    title: 'S1–S2 · output against input',
    subtitle: `Drive ${result.protocol.driveCycleMs} ms at ${result.protocol.siteId} · Dashed ERP thresholds`,
    xLabel: 'A1–A2 (ms)',
    yLabel: `${outputLabel} (ms)`,
    xDomain,
    yDomain,
    layers,
    table: { caption: 'S1–S2 output curve', columns: ['A1–A2 (ms)', `${outputLabel} (ms)`], rows: points },
    summary: `${text.join('; ')}.`,
  };
}

// ---------------------------------------------------------------------------
// Incremental pacing

function incrementalModel(result, { outputLabel = 'AH' } = {}) {
  const dots = [];
  for (const row of result.rows) {
    const values = new Set(String(row.sequenceMs).split(' ').filter(v => v !== 'x' && v !== '').map(Number));
    for (const value of values) dots.push([row.cycleMs, value, row.ratio]);
  }
  const conducted = dots.map(d => d[1]);
  const yDomain = extent(conducted, 0.18);
  const layers = [
    { type: 'line', points: result.rows.filter(r => r.ratio === '1:1').map(r => [r.cycleMs, r.steadyMs]), color: S.gold, width: 0.9, alpha: 0.6, glow: true },
    { type: 'dots', points: dots.filter(d => d[2] === '1:1'), color: S.gold, radius: 2.3 },
    { type: 'dots', points: dots.filter(d => d[2] !== '1:1'), color: S.blue, radius: 2.3 },
  ];
  // Label each new conduction ratio once, where it first appears.
  let previous = '1:1';
  let shown = 0;
  for (const row of result.rows) {
    if (row.ratio && row.ratio !== previous) {
      // Alternate two rows so neighbouring ratios 10 ms apart stay legible.
      const lift = (shown++ % 2) * 0.08;
